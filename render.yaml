services:
  - type: web
    name: intellicpp
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXECUTION_TIMEOUT_MS
        value: 5000
      - key: ALLOWED_ORIGINS
        value: "*"
